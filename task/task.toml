[task]
id = "bitemporal-expense-ledger"
name = "Bitemporal Expense Ledger State Machine"
version = "1.0.0"
task_objective = "Implement a backend state machine to resolve out-of-order bitemporal expense ledger events into net balances."
difficulty_explanation = "Requires 2D bitemporal filtering, tie-breaking logic, DAG parent cycle detection, cutoff orphan masking, ancestor revocation propagation, participant deduplication, and exact integer penny-rounding."
solution_explanation = "Applies global 2D bitemporal filter first, sorts status/correction events by system_revision descending then event_id ascending, builds parent graph to detect cycles/orphans, calculates ancestor activation, and computes net integer-cent balances."
verification_explanation = "Evaluates generated /app/balances.json against hidden ground truth expected balances using pytest, checking exact string formatting, zero balance completeness, and penny-rounding accuracy."
artifact_type = "JSON"
expert_time_estimate_hours = 6

[environment]
dockerfile = "environment/Dockerfile"
allow_internet = true

[verifier]
timeout_sec = 300
script = "tests/test.sh"

[agent]
timeout_sec = 3600
